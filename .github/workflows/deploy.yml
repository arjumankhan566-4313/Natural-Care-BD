# Cloudflare Workers deploy
#
# - Every push to `main`  → typecheck + build + apply D1 migrations + `wrangler deploy` (production)
# - Every pull request    → typecheck + build + `wrangler deploy --dry-run` (no upload, validates config)
# - Manual (Actions tab)  → "Run workflow" on any branch
#
# One-time setup (GitHub → repo → Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard → My Profile → API Tokens → Create Token →
#                          template "Edit Cloudflare Workers", plus permission  Account · D1 · Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Overview (right sidebar) → Account ID
name: Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cf-workers-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      # Secrets are empty on forks / until configured — deploy steps then skip gracefully
      # (Cloudflare "Workers Builds" GitHub integration, if connected, still deploys on its own).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Tailwind CSS + Worker bundle)
        run: npm run build

      # ---------- Pull requests: validate only ----------
      - name: Validate Worker config (dry run)
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run

      # ---------- main / manual: real deploy ----------
      - name: Secrets missing → skip deploy
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets not set — build validated, deploy skipped (add the secrets to enable deploy from Actions)."

      - name: Apply D1 migrations (production)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply natural-care-bd-production --remote

      - name: Deploy Worker
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
